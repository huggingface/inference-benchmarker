[package]
name = "inference-benchmarker"
version = "1.1.0"
edition = "2021"
authors = ["Hugo Larcher <hugo.larcher@huggingface.co>"]
repository = "https://github.com/huggingface/inference-benchmarker"
readme = "README.md"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["cli"]
# The command-line tool and its terminal UI. Library users turn this off.
cli = ["dep:clap", "dep:ratatui", "dep:crossterm", "dep:tabled", "dep:env_logger", "dep:humantime"]

[dependencies]
anyhow = "1.0.86"
async-trait = "0.1.82"
chrono = { version = "0.4.38", features = ["serde"] }
futures-util = "0.3.30"
log = "0.4.22"
rand = "0.9.0"
rand_distr = "0.5.1"
rayon = "1.10.0"
regex = "1.10"
reqwest = { version = "0.12.7", default-features = false, features = ["json", "rustls-tls"] }
reqwest-eventsource = "0.6.0"
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.127"
serde_with = "3.9.0"
strum_macros = "0.27.1"
sysinfo = "0.33.1"
tokenizers = { version = "0.21.1", default-features = false, features = ["onig"] }
tokio = { version = "1.40.0", features = ["rt", "rt-multi-thread", "macros", "signal", "time", "sync"] }
uuid = { version = "1.11.0", features = ["v4", "fast-rng", "serde"] }
# cli
clap = { version = "4.5.17", features = ["derive", "env"], optional = true }
crossterm = { version = "0.28.1", optional = true }
env_logger = { version = "0.11.5", optional = true }
humantime = { version = "2.1.0", optional = true }
ratatui = { version = "0.29.0", features = ["all-widgets"], optional = true }
tabled = { version = "=0.14", optional = true }

[dev-dependencies]
mockito = "1.5.0"
tokenizers = { version = "0.21.1", features = ["http"] }

[build-dependencies]
vergen-gitcl = { version = "1.0.1" }

[[bin]]
name = "inference-benchmarker"
path = "src/main.rs"
required-features = ["cli"]
test = false
bench = false